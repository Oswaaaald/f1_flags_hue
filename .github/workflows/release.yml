name: Build installers
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publier la release après validation des paquets
        type: boolean
        default: false
  push:
    branches: ['release/**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix apps/web
      - if: runner.os != 'Windows'
        run: scripts/publish.sh '${{ matrix.runtime }}'
        env:
          F1_HUE_RELEASES_URL: https://github.com/${{ github.repository }}/releases
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          deploy/windows/build.ps1 -Runtime '${{ matrix.runtime }}'
          New-Item -ItemType Directory -Force 'artifacts/${{ matrix.runtime }}/service' | Out-Null
          Copy-Item 'artifacts/${{ matrix.runtime }}/desktop/service/*' 'artifacts/${{ matrix.runtime }}/service/' -Recurse -Force
        env:
          F1_HUE_RELEASES_URL: https://github.com/${{ github.repository }}/releases
      - name: Validate version and packaged service on its native OS
        shell: bash
        run: |
          node scripts/check-release.mjs '${{ matrix.runtime }}'
          service="$PWD/artifacts/${{ matrix.runtime }}/service/f1-hue"
          if [ '${{ runner.os }}' = 'Windows' ]; then service="$service.exe"; fi
          F1_HUE_TEST_EXECUTABLE="$service" node tests/api-smoke.mjs
          F1_HUE_TEST_EXECUTABLE="$service" node tests/desktop-auth.mjs
          F1_HUE_TEST_EXECUTABLE="$service" node tests/audit-api.mjs
      - name: Test the macOS menu application lifecycle
        if: runner.os == 'macOS'
        run: bash tests/macos-launcher.sh 'artifacts/${{ matrix.runtime }}/F1 Hue Sync.app'
      - name: Test Linux user service installation and update
        if: runner.os == 'Linux'
        run: bash tests/systemd-lifecycle.sh 'artifacts/${{ matrix.runtime }}/service'
      - name: Test Windows installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/windows-installer.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f1-hue-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/*.runtime.json
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/f1-hue-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f1-hue-docker
          path: /tmp/f1-hue-image.tar
  inventory:
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: f1-hue-*
          path: release
          merge-multiple: true
      - name: Expand packages for the release inventory
        run: node scripts/expand-release.mjs
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: inventory
          format: spdx-json
          syft-version: v1.54.1
          output-file: release/f1-hue-release.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: release/f1-hue-release.spdx.json
          grype-version: v0.120.1
          severity-cutoff: high
          output-format: json
          output-file: release/vulnerability-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f1-hue-inventory
          path: |
            release/f1-hue-release.spdx.json
            release/vulnerability-report.json
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref_name == 'main')
    needs: [verify, desktop, docker, inventory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: f1-hue-*
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Check tag, calculate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          args=()
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(node scripts/check-release-tag.mjs)"
            args+=(--target "$RELEASE_TARGET")
          else
            args+=(--verify-tag)
          fi
          node scripts/check-release-tag.mjs "$RELEASE_TAG"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/f1-hue-release-notes.md"
          cd release
          sha256sum *.zip *.tar.gz *.exe *.tar *.json > SHA256SUMS
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --title "F1 Hue Sync $RELEASE_TAG" --notes-file "$RUNNER_TEMP/f1-hue-release-notes.md" "${args[@]}" ./*
