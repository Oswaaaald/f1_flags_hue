name: Scheduled security audit
on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          dotnet restore F1Hue.slnx --locked-mode
          node scripts/audit-dotnet.mjs
          npm ci --prefix apps/web
          npm audit --prefix apps/web
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build -f deploy/docker/Dockerfile -t f1-hue:security .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: f1-hue:security
          syft-version: v1.54.1
          output-file: container.spdx.json
          upload-release-assets: false
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: container.spdx.json
          grype-version: v0.120.1
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            container.spdx.json
            vulnerability-report.json
          retention-days: 30
