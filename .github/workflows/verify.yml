name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: scripts/build.sh
      - run: npm run format:check --prefix apps/web
      - run: node tests/api-smoke.mjs
        env:
          F1_HUE_TEST_BUILD: Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - if: runner.os == 'Linux'
        run: node scripts/audit-dotnet.mjs
      - if: runner.os == 'Linux'
        run: npm audit --prefix apps/web
      - if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - if: runner.os == 'Linux'
        run: docker build -f deploy/docker/Dockerfile -t f1-hue:test .
