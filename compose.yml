services:
  f1-hue:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - f1-hue-data:/data
    environment:
      F1_HUE_LISTEN: 0.0.0.0
      F1_HUE_PORT: 8080
      F1_HUE_DATA_DIR: /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 45s
volumes:
  f1-hue-data:
